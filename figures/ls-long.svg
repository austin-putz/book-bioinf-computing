<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" role="img" aria-labelledby="ls-long-title">
  <title id="ls-long-title">Reading ls -l output, field by field. Top, one line from ls -lh data/raw: -r--r--r-- 1 you you 2.2M Nov 17 11:22 SRR6357070_1.fastq.gz. The first character is the type: a dash for a file, d for a folder, l for a link. The next nine characters are the permissions, covered in Chapter 7. Then the link count, the owner, the group, the size (with -h in human units such as K, M, G), the date and time the file was last modified, and the name. Bottom, from ls -l data/ref: lrwxrwxrwx 1 you you 53 Nov 17 11:22 data/ref -> /home/you/bioinf-shared/references/yeast_R64-1-1_test. The type l marks a link; its size, 53, is the length of the path it holds; data/ref is the link's name; and the path after the arrow is the target, where the link points.</title>

  <!-- Panel 1: a regular file -->
  <rect x="10" y="10" width="700" height="200" rx="10" class="fill-surface stroke-line"/>
  <text x="26" y="34" font-size="13" class="fill-muted">one line from <tspan class="mono">ls -lh data/raw</tspan></text>

  <!-- 15px mono, 9 units per character, starting at x=60 -->
  <g font-size="15" class="mono">
    <text x="60" y="70" font-weight="700">-</text>
    <text x="69" y="70">r--r--r--</text>
    <text x="159" y="70">1</text>
    <text x="177" y="70">you</text>
    <text x="213" y="70">you</text>
    <text x="249" y="70">2.2M</text>
    <text x="294" y="70">Nov 17 11:22</text>
    <text x="411" y="70" class="fill-given" font-weight="700">SRR6357070_1.fastq.gz</text>
  </g>

  <!-- Brackets under each field -->
  <g class="stroke-muted" stroke-width="1.5" fill="none">
    <path d="M60 78 v5 h9 v-5"/>
    <path d="M71 78 v5 h77 v-5"/>
    <path d="M159 78 v5 h9 v-5"/>
    <path d="M177 78 v5 h27 v-5"/>
    <path d="M213 78 v5 h27 v-5"/>
    <path d="M249 78 v5 h36 v-5"/>
    <path d="M294 78 v5 h108 v-5"/>
    <path d="M411 78 v5 h189 v-5"/>
  </g>
  <!-- Leaders down to the second label row -->
  <g class="stroke-muted" stroke-width="1" fill="none">
    <path d="M64.5 83 V140"/>
    <path d="M163.5 83 V140"/>
    <path d="M226.5 83 V140"/>
  </g>

  <g font-size="13" text-anchor="middle">
    <!-- row 1 -->
    <text x="109.5" y="106" font-weight="700">permissions</text>
    <text x="109.5" y="122" class="fill-muted">(Chapter 7)</text>
    <text x="190.5" y="106" font-weight="700">owner</text>
    <text x="267" y="106" font-weight="700">size</text>
    <text x="267" y="122" class="fill-muted">with <tspan class="mono">-h</tspan>:</text>
    <text x="267" y="138" class="fill-muted">K, M, G</text>
    <text x="348" y="106" font-weight="700">modified</text>
    <text x="348" y="122" class="fill-muted">date and time</text>
    <text x="505.5" y="106" font-weight="700">name</text>
    <!-- row 2 -->
    <text x="64.5" y="156" font-weight="700">type</text>
    <text x="163.5" y="156" font-weight="700">links</text>
    <text x="226.5" y="156" font-weight="700">group</text>
  </g>
  <g font-size="13" class="fill-muted">
    <text x="40" y="176"><tspan class="mono" font-weight="700">-</tspan>  file</text>
    <text x="40" y="192"><tspan class="mono" font-weight="700">d</tspan>  folder</text>
    <text x="96" y="176"><tspan class="mono" font-weight="700">l</tspan>  link</text>
  </g>

  <!-- Panel 2: a link -->
  <rect x="10" y="222" width="700" height="196" rx="10" class="fill-surface stroke-line"/>
  <text x="26" y="246" font-size="13" class="fill-muted">from <tspan class="mono">ls -l data/ref</tspan></text>

  <g font-size="15" class="mono">
    <text x="60" y="282" font-weight="700">l</text>
    <text x="69" y="282">rwxrwxrwx</text>
    <text x="159" y="282">1</text>
    <text x="177" y="282">you</text>
    <text x="213" y="282">you</text>
    <text x="267" y="282">53</text>
    <text x="294" y="282">Nov 17 11:22</text>
    <text x="411" y="282" class="fill-given" font-weight="700">data/ref</text>
    <text x="492" y="282">-&gt;</text>
    <text x="96" y="370" class="fill-ref" font-weight="700">/home/you/bioinf-shared/references/yeast_R64-1-1_test</text>
  </g>
  <text x="528" y="281" font-size="12" class="fill-muted">(one line; wrapped</text>
  <text x="528" y="296" font-size="12" class="fill-muted">here to fit ↓)</text>

  <g class="stroke-muted" stroke-width="1.5" fill="none">
    <path d="M60 290 v5 h9 v-5"/>
    <path d="M267 290 v5 h18 v-5"/>
    <path d="M411 290 v5 h72 v-5"/>
  </g>
  <path d="M96 378 v5 h477 v-5" class="stroke-ref" stroke-width="2" fill="none"/>

  <g font-size="13" text-anchor="middle">
    <text x="64.5" y="316" font-weight="700">type: <tspan class="mono">l</tspan> = link</text>
    <text x="276" y="316" font-weight="700">size</text>
    <text x="276" y="332" class="fill-muted">the path it holds is</text>
    <text x="276" y="348" class="fill-muted">53 characters long</text>
    <text x="447" y="316" font-weight="700">the link's name</text>
    <text x="334.5" y="404"><tspan font-weight="700">target:</tspan> <tspan class="fill-muted">where the link points (the path after</tspan> <tspan class="mono fill-muted">-&gt;</tspan><tspan class="fill-muted">)</tspan></text>
  </g>
</svg>
