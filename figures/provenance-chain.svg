<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="provenance-chain-title">
  <title id="provenance-chain-title">Where results/read_counts.tsv came from. Four records point to it: the code (src/01_count_reads.sh, its checksum, and the command it ran); the software (pixi.lock, and the seqkit version in the log); the inputs it read (the two FASTQ files in data/raw and checksums.md5), which in turn point back to data/README.md with each file's source address, commit, accession, and date; and the log of the run (what happened, when, on which machine). The reference in data/ref and the upstream sample sheet are greyed out: they are project records, not inputs to this result.</title>
  <defs>
    <marker id="provenance-chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-muted"/>
    </marker>
  </defs>

  <!-- The result -->
  <rect x="530" y="150" width="180" height="70" rx="10" class="fill-given-soft stroke-given" stroke-width="1.5"/>
  <text x="544" y="176" font-size="13" font-weight="700" class="mono">results/</text>
  <text x="544" y="198" font-size="13" font-weight="700" class="mono">read_counts.tsv</text>

  <!-- Code -->
  <rect x="210" y="20" width="250" height="70" rx="8" class="fill-surface stroke-ink" stroke-width="1.25"/>
  <text x="224" y="42" font-size="12" font-weight="700" letter-spacing="1" class="fill-muted">CODE</text>
  <text x="224" y="62" font-size="12" class="mono">src/01_count_reads.sh</text>
  <text x="224" y="80" font-size="12" class="fill-muted">+ its checksum, the command</text>

  <!-- Software -->
  <rect x="210" y="100" width="250" height="70" rx="8" class="fill-surface stroke-line" stroke-width="1.25"/>
  <text x="224" y="122" font-size="12" font-weight="700" letter-spacing="1" class="fill-muted">SOFTWARE</text>
  <text x="224" y="142" font-size="12" class="mono">pixi.lock</text>
  <text x="224" y="160" font-size="12" class="fill-muted">+ seqkit version, in the log</text>

  <!-- Inputs -->
  <rect x="210" y="180" width="250" height="72" rx="8" class="fill-given-soft stroke-given" stroke-width="1.25"/>
  <text x="224" y="202" font-size="12" font-weight="700" letter-spacing="1" class="fill-muted">INPUTS IT READ</text>
  <text x="224" y="222" font-size="12" class="mono">data/raw/SRR6357070_*.fastq.gz</text>
  <text x="224" y="241" font-size="12" class="mono fill-good">data/raw/checksums.md5</text>

  <!-- Log -->
  <rect x="210" y="270" width="250" height="70" rx="8" class="fill-good-soft stroke-good" stroke-width="1.25"/>
  <text x="224" y="292" font-size="12" font-weight="700" letter-spacing="1" class="fill-muted">WHAT HAPPENED</text>
  <text x="224" y="312" font-size="12" class="mono">logs/01_count_reads_…log</text>
  <text x="224" y="330" font-size="12" class="fill-muted">when, where, checks, output</text>

  <!-- Where the inputs came from -->
  <rect x="10" y="180" width="170" height="72" rx="8" class="fill-surface stroke-line" stroke-width="1.25"/>
  <text x="22" y="202" font-size="12" font-weight="700" letter-spacing="1" class="fill-muted">SOURCES</text>
  <text x="22" y="222" font-size="12" class="mono">data/README.md</text>
  <text x="22" y="241" font-size="12" class="fill-muted">URL, commit, accession</text>

  <!-- Arrows: everything points to the result; sources point to inputs -->
  <g class="stroke-muted" stroke-width="1.75" fill="none" marker-end="url(#provenance-chain-arrow)">
    <path d="M462,55 C 500,51 500,165 528,170"/>
    <path d="M462,135 C 495,131 500,175 528,180"/>
    <path d="M462,216 C 495,216 505,195 528,192"/>
    <path d="M462,305 C 500,301 500,215 528,208"/>
    <path d="M182,216 L 208,216"/>
  </g>

  <!-- Project records that are not inputs to this result -->
  <rect x="10" y="352" width="450" height="42" rx="8" fill="none" class="stroke-line" stroke-dasharray="4 3"/>
  <text x="22" y="370" font-size="12" class="mono fill-muted">data/ref/   data/meta/samplesheet_upstream.csv</text>
  <text x="22" y="387" font-size="12" class="fill-muted">project records, not inputs to this result</text>
</svg>
