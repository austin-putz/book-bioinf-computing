<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" role="img" aria-labelledby="resource-box-title">
  <title id="resource-box-title">A job request as a box. One compute node is drawn as 16 CPU squares and a 64 GB memory bar; your request, outlined with a dashed line, is 4 of the CPUs and 16 GB of the memory. On a time axis the request is one box: 4 CPUs and 16 GB on one node for 2 hours, written --cpus-per-task=4, --mem=16G, and --time=02:00:00. Three panels show what happens at the edges of the box. In panel a, memory use rises past the top of the box, above 16 GB, and the job is killed with the state OUT_OF_MEMORY. In panel b, the script is still running when the box ends at 2 hours, and the job is killed with the state TIMEOUT. In panel c, the tool uses only 1 of the 4 reserved CPUs: the job finishes, but the other 3 CPUs sit idle and are still reserved for you, which is waste, not an error.</title>
  <defs>
    <marker id="resource-box-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-muted"/>
    </marker>
  </defs>

  <!-- One compute node -->
  <rect x="10" y="10" width="304" height="216" rx="10" class="fill-surface stroke-ink" stroke-width="1.25"/>
  <text x="26" y="36" font-size="15" font-weight="700">One compute node</text>
  <text x="26" y="54" font-size="12" class="fill-muted">16 CPUs, 64 GB memory</text>

  <!-- CPUs: 4 x 4; the bottom row is your request -->
  <g class="fill-surface stroke-line" stroke-width="1.5">
    <rect x="26" y="64" width="26" height="26" rx="3"/>
    <rect x="58" y="64" width="26" height="26" rx="3"/>
    <rect x="90" y="64" width="26" height="26" rx="3"/>
    <rect x="122" y="64" width="26" height="26" rx="3"/>
    <rect x="26" y="94" width="26" height="26" rx="3"/>
    <rect x="58" y="94" width="26" height="26" rx="3"/>
    <rect x="90" y="94" width="26" height="26" rx="3"/>
    <rect x="122" y="94" width="26" height="26" rx="3"/>
    <rect x="26" y="124" width="26" height="26" rx="3"/>
    <rect x="58" y="124" width="26" height="26" rx="3"/>
    <rect x="90" y="124" width="26" height="26" rx="3"/>
    <rect x="122" y="124" width="26" height="26" rx="3"/>
  </g>
  <g class="fill-ink-soft stroke-ink" stroke-width="1.25">
    <rect x="26" y="162" width="26" height="26" rx="3"/>
    <rect x="58" y="162" width="26" height="26" rx="3"/>
    <rect x="90" y="162" width="26" height="26" rx="3"/>
    <rect x="122" y="162" width="26" height="26" rx="3"/>
  </g>

  <!-- Memory bar: 64 GB, of which 16 GB requested -->
  <rect x="172" y="64" width="30" height="124" rx="3" class="fill-surface stroke-line" stroke-width="1.5"/>
  <rect x="172" y="157" width="30" height="31" rx="2" class="fill-ink-soft stroke-ink" stroke-width="1.25"/>

  <!-- Your request -->
  <rect x="19" y="154" width="190" height="40" rx="6" fill="none" class="stroke-ink" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="216" y="172" font-size="12" font-weight="700">your request</text>
  <text x="216" y="187" font-size="12" class="fill-muted">4 CPUs, 16 GB</text>
  <g font-size="12" text-anchor="middle" class="fill-muted">
    <text x="87" y="212">CPUs</text>
    <text x="187" y="212">memory</text>
  </g>

  <!-- The request as a box on a time axis -->
  <text x="330" y="34" font-size="15" font-weight="700">Your request is a box:</text>
  <text x="330" y="54" font-size="13">CPUs × memory × time, all on one node</text>
  <rect x="490" y="80" width="180" height="88" rx="3" class="fill-ink-soft stroke-ink" stroke-width="1.25"/>
  <text x="580" y="112" font-size="14" font-weight="700" text-anchor="middle">4 CPUs</text>
  <text x="580" y="132" font-size="13" text-anchor="middle">16 GB memory</text>
  <text x="580" y="152" font-size="12" text-anchor="middle" class="fill-muted">for 2 hours</text>
  <g font-size="12" text-anchor="end" class="mono">
    <text x="478" y="112">--cpus-per-task=4</text>
    <text x="478" y="132">--mem=16G</text>
  </g>
  <line x1="490" y1="168" x2="706" y2="168" class="stroke-muted" stroke-width="1.5" marker-end="url(#resource-box-arrow)"/>
  <g class="stroke-muted" stroke-width="1.5">
    <line x1="490" y1="168" x2="490" y2="174"/>
    <line x1="580" y1="168" x2="580" y2="174"/>
    <line x1="670" y1="168" x2="670" y2="174"/>
  </g>
  <g font-size="12" text-anchor="middle" class="fill-muted">
    <text x="490" y="188">0</text>
    <text x="580" y="188">1 h</text>
    <text x="670" y="188">2 h</text>
  </g>
  <text x="478" y="172" font-size="12" text-anchor="end" class="fill-muted">time</text>
  <text x="580" y="208" font-size="12" text-anchor="middle" class="mono">--time=02:00:00</text>

  <!-- Three panels -->
  <g fill="none" class="stroke-line" stroke-width="1.5">
    <rect x="10" y="244" width="220" height="208" rx="10"/>
    <rect x="250" y="244" width="220" height="208" rx="10"/>
    <rect x="490" y="244" width="220" height="208" rx="10"/>
  </g>
  <g font-size="13" font-weight="700">
    <text x="24" y="268">(a) Memory use grows</text>
    <text x="264" y="268">(b) The run is too long</text>
    <text x="504" y="268">(c) The tool uses 1 CPU</text>
  </g>

  <!-- (a) memory past the top of the box -->
  <rect x="34" y="304" width="160" height="68" class="fill-ink-soft stroke-ink" stroke-width="1.25"/>
  <g class="stroke-muted" stroke-width="1.5">
    <line x1="34" y1="372" x2="34" y2="286" marker-end="url(#resource-box-arrow)"/>
    <line x1="34" y1="372" x2="216" y2="372" marker-end="url(#resource-box-arrow)"/>
  </g>
  <text x="42" y="292" font-size="12" class="fill-muted">memory</text>
  <text x="190" y="300" font-size="12" text-anchor="end" class="fill-muted">16 GB</text>
  <polyline points="34,364 70,352 96,328 110,304" class="stroke-ink" stroke-width="2"/>
  <polyline points="110,304 120,288" class="stroke-warn" stroke-width="2"/>
  <g class="stroke-warn" stroke-width="2">
    <line x1="117" y1="281" x2="127" y2="291"/>
    <line x1="127" y1="281" x2="117" y2="291"/>
  </g>
  <text x="188" y="365" font-size="12" text-anchor="end" class="fill-muted">request</text>
  <g font-size="12" text-anchor="middle" class="fill-muted">
    <text x="114" y="388">time</text>
    <text x="194" y="388">2 h</text>
  </g>
  <text x="24" y="416" font-size="13" font-weight="700" class="fill-warn">killed: <tspan class="mono">OUT_OF_MEMORY</tspan></text>
  <text x="24" y="434" font-size="12" class="fill-muted">memory use went over 16 GB</text>

  <!-- (b) run time past the end of the box -->
  <rect x="274" y="304" width="160" height="68" class="fill-ink-soft stroke-ink" stroke-width="1.25"/>
  <g class="stroke-muted" stroke-width="1.5">
    <line x1="274" y1="372" x2="274" y2="286" marker-end="url(#resource-box-arrow)"/>
    <line x1="274" y1="372" x2="456" y2="372" marker-end="url(#resource-box-arrow)"/>
  </g>
  <text x="282" y="328" font-size="12" class="fill-muted">script running</text>
  <line x1="274" y1="340" x2="434" y2="340" class="stroke-ink" stroke-width="6"/>
  <line x1="434" y1="340" x2="446" y2="340" class="stroke-warn" stroke-width="6"/>
  <g class="stroke-warn" stroke-width="2">
    <line x1="447" y1="335" x2="457" y2="345"/>
    <line x1="457" y1="335" x2="447" y2="345"/>
  </g>
  <text x="428" y="365" font-size="12" text-anchor="end" class="fill-muted">request</text>
  <g font-size="12" text-anchor="middle" class="fill-muted">
    <text x="354" y="388">time</text>
    <text x="434" y="388">2 h</text>
  </g>
  <text x="264" y="416" font-size="13" font-weight="700" class="fill-warn">killed: <tspan class="mono">TIMEOUT</tspan></text>
  <text x="264" y="434" font-size="12" class="fill-muted">still running when 2 h ran out</text>

  <!-- (c) 1 of 4 reserved CPUs used -->
  <g font-size="12" text-anchor="middle">
    <text x="543" y="302">busy</text>
    <text x="634" y="302" class="fill-muted">idle, still reserved</text>
  </g>
  <rect x="528" y="312" width="30" height="30" rx="3" class="fill-ink-soft stroke-ink" stroke-width="1.25"/>
  <g class="fill-muted-soft stroke-muted" stroke-width="1.25" stroke-dasharray="4 3">
    <rect x="570" y="312" width="30" height="30" rx="3"/>
    <rect x="610" y="312" width="30" height="30" rx="3"/>
    <rect x="650" y="312" width="30" height="30" rx="3"/>
  </g>
  <text x="604" y="366" font-size="12" text-anchor="middle" class="mono fill-muted">--cpus-per-task=4</text>
  <text x="604" y="386" font-size="12" text-anchor="middle" class="fill-muted">but the tool started 1 thread</text>
  <text x="504" y="416" font-size="13" font-weight="700">finishes, but 3 CPUs idle</text>
  <text x="504" y="434" font-size="12" class="fill-muted">waste, not an error</text>
</svg>
