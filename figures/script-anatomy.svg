<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" role="img" aria-labelledby="script-anatomy-title">
  <title id="script-anatomy-title">Chapter 3's script src/01_count_reads.sh, shortened, with its parts named in the margin. Line 1, the shebang #!/usr/bin/env bash, names the program that runs the file. Lines 2 and 3, comments, say what the script does and how to run it. Line 4, set -euo pipefail, is the settings line. Lines 6 and 7 set up: mkdir -p results logs, and a unique log file name made with mktemp and date. Inside a group that starts with an opening brace, echo lines record provenance: start time, the script's checksum, host and seqkit version. The line (cd data/raw &amp;&amp; md5sum -c checksums.md5) checks the inputs against their checksums. seqkit stats does the work and writes to a .tmp file, and mv then gives the output its real name. Two more echo lines record the output's checksum and the end time. The last line, closing brace 2&gt;&amp;1 | tee "$log", sends everything the group prints both to the screen and to the log file.</title>

  <text x="20" y="26" font-size="14" font-weight="700" class="mono">src/01_count_reads.sh</text>
  <text x="212" y="26" font-size="13" class="fill-muted">(shortened)</text>

  <!-- Code box -->
  <rect x="10" y="38" width="538" height="368" rx="10" class="fill-surface stroke-ink" stroke-width="1.25"/>
  <g font-size="12" class="mono">
    <text x="24" y="60">#!/usr/bin/env bash</text>
    <text x="24" y="79" class="fill-muted"># 01_count_reads.sh: check the raw FASTQ files, then count their reads.</text>
    <text x="24" y="98" class="fill-muted"># Run from the project folder:  pixi run bash src/01_count_reads.sh</text>
    <text x="24" y="117" font-weight="700">set -euo pipefail</text>
    <text x="24" y="155">mkdir -p results logs</text>
    <text x="24" y="174">log="$(mktemp "logs/01_count_reads_$(date …)_XXXX.log")"</text>
    <text x="24" y="212">{</text>
    <text x="40" y="231">echo "started:  $(date …)"</text>
    <text x="40" y="250">echo "script:   $(md5sum src/01_count_reads.sh)"</text>
    <text x="40" y="269" class="fill-muted">…  (host, seqkit version)</text>
    <text x="40" y="288">(cd data/raw &amp;&amp; md5sum -c checksums.md5)</text>
    <text x="40" y="307">seqkit stats --quiet -T data/raw/*.fastq.gz &gt; results/….tmp</text>
    <text x="40" y="326">mv results/read_counts.tsv.tmp results/read_counts.tsv</text>
    <text x="40" y="345">echo "output:   $(md5sum results/read_counts.tsv)"</text>
    <text x="40" y="364">echo "finished: $(date …)"</text>
    <text x="24" y="383">} 2&gt;&amp;1 | tee "$log"</text>
  </g>

