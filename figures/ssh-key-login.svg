<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="ssh-key-login-title"
     data-step-labels="Make a pair|Copy once|Challenge|Sign|Logged in">
  <title id="ssh-key-login-title">How SSH key login works, in five steps. On your laptop, ssh-keygen makes a pair of keys: a private key, id_ed25519, locked by your passphrase, and a public key, id_ed25519.pub. Once, with an ordinary password login, ssh-copy-id copies the public key into ~/.ssh/authorized_keys on the cluster. At each login, the cluster sends a challenge, a random message. The laptop signs it with the private key, which the agent holds unlocked, and sends back only the signature; the cluster checks the signature with the public key. You are logged in with no code and no password. The private key never crosses the line between laptop and cluster. On SCINet, step gives you a certificate for the day instead.</title>
  <desc data-caption="1">ssh-keygen makes a pair on your laptop: the private key, locked by your passphrase, and the public key.</desc>
  <desc data-caption="2">Once, with an ordinary password login, ssh-copy-id copies the public key into ~/.ssh/authorized_keys on the cluster.</desc>
  <desc data-caption="3">At each login, the cluster sends a challenge: a random message only the matching private key can sign.</desc>
  <desc data-caption="4">The laptop signs it with the private key (the agent holds it unlocked) and sends back only the signature; the cluster checks it with the public key.</desc>
  <desc data-caption="5">The signature fits, so you are logged in: no code, no password. The private key itself never left your laptop.</desc>
  <defs>
    <marker id="ssh-key-login-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-muted"/>
    </marker>
  </defs>

  <!-- Laptop -->
  <rect x="10" y="20" width="260" height="290" rx="12" class="fill-surface stroke-line"/>
  <text x="26" y="46" font-size="16" font-weight="700">Your laptop</text>

  <!-- Private key -->
  <rect x="28" y="62" width="224" height="70" rx="8" class="fill-surface stroke-ink" stroke-width="1.5"/>
  <text x="42" y="86" font-size="14" font-weight="700">private key</text>
  <text x="42" y="106" font-size="13" class="mono">id_ed25519</text>
  <text x="42" y="124" font-size="12" class="fill-muted">locked by your passphrase</text>
  <text x="42" y="150" font-size="12" class="fill-muted" data-show="4">the agent holds it unlocked</text>

  <!-- Public key on the laptop -->
  <rect x="28" y="166" width="224" height="58" rx="8" class="fill-surface stroke-line" stroke-width="1.25"/>
  <text x="42" y="190" font-size="14" font-weight="700">public key</text>
  <text x="42" y="210" font-size="13" class="mono">id_ed25519.pub</text>

  <!-- The boundary the private key never crosses -->
  <line x1="320" y1="20" x2="320" y2="310" class="stroke-warn" stroke-width="1.75" stroke-dasharray="6 5"/>
  <text x="320" y="334" font-size="12" text-anchor="middle" class="fill-warn">the private key never crosses this line</text>

  <!-- Cluster -->
  <rect x="370" y="20" width="340" height="290" rx="12" class="fill-surface stroke-ink" stroke-width="1.25"/>
  <text x="386" y="46" font-size="16" font-weight="700">The cluster (login node)</text>

  <!-- authorized_keys with the copied public key -->
  <rect x="388" y="62" width="304" height="76" rx="8" class="fill-surface stroke-line" stroke-width="1.25" data-show="2"/>
  <text x="402" y="84" font-size="13" class="mono" data-show="2">~/.ssh/authorized_keys</text>
  <g data-show="2" data-move="2" style="--dx:-382px; --dy:110px">
    <rect x="402" y="94" width="276" height="34" rx="6" class="fill-surface stroke-ink" stroke-width="1.25"/>
    <text x="414" y="116" font-size="13">a copy of your public key</text>
  </g>
  <text x="530" y="160" font-size="12" text-anchor="middle" class="fill-muted" data-show="2" data-hide="3">ssh-copy-id, once, with your password</text>

  <!-- Step 3: challenge -->
  <g data-show="3">
    <line x1="386" y1="196" x2="256" y2="196" class="stroke-muted" stroke-width="1.75" marker-end="url(#ssh-key-login-arrow)"/>
    <text x="520" y="200" font-size="13" text-anchor="middle">challenge: a random message</text>
  </g>

  <!-- Step 4: signature, checked -->
  <g data-show="4">
    <line x1="256" y1="236" x2="386" y2="236" class="stroke-muted" stroke-width="1.75" marker-end="url(#ssh-key-login-arrow)"/>
    <text x="140" y="250" font-size="13" text-anchor="middle">signature only</text>
    <text x="530" y="240" font-size="13" text-anchor="middle" class="fill-good">checked with the public key ✓</text>
  </g>

  <!-- Step 5: logged in -->
  <g data-show="5">
    <rect x="388" y="258" width="304" height="40" rx="8" class="fill-good-soft stroke-good" stroke-width="1.25"/>
    <text x="540" y="283" font-size="14" font-weight="700" text-anchor="middle" class="fill-good">logged in: no code, no password</text>
    <text x="28" y="290" font-size="12" class="fill-muted">SCINet: step gives you a</text>
    <text x="28" y="304" font-size="12" class="fill-muted">certificate for the day instead</text>
  </g>
</svg>
