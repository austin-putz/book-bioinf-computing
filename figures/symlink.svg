<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="symlink-title"
     data-step-labels="Link|Read|Write|Unlink">
  <title id="symlink-title">A symbolic link, in four steps. The project folder ~/bioinf-book/data holds raw, meta, and ref; ref is a link that points to the shared folder ~/bioinf-shared/references/yeast_R64-1-1_test, which holds README.md, checksums.md5, genes.gtf.gz, and genome.fa.gz. Listing data/ref/ shows the shared folder's files, read through the link. Writing through the link would change the shared files themselves; because the shared folder is protected, the write is refused. unlink data/ref removes only the link; the shared folder and its files are untouched.</title>
  <desc data-caption="1">data/ref is a link: a small entry that holds only the path of the shared folder. ls -l shows it with an arrow.</desc>
  <desc data-caption="2">Reading through the link reads the shared folder itself: ls data/ref/ lists the shared files. Nothing was copied.</desc>
  <desc data-caption="3">Writing through the link would change the one shared copy, which every project uses. You protected it, so the write is refused.</desc>
  <desc data-caption="4">unlink data/ref removes only the link. The shared folder and its files are untouched.</desc>
  <defs>
    <marker id="symlink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-ref"/>
    </marker>
    <marker id="symlink-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-muted"/>
    </marker>
  </defs>

  <!-- The project -->
  <rect x="10" y="20" width="240" height="196" rx="12" fill="none" class="stroke-line" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="26" y="44" font-size="14" font-weight="700" class="mono">~/bioinf-book/data/</text>
  <rect x="30" y="62" width="200" height="34" rx="6" class="fill-given-soft stroke-given"/>
  <text x="44" y="84" font-size="13" class="mono">raw/</text>
  <rect x="30" y="106" width="200" height="34" rx="6" class="fill-given-soft stroke-given"/>
  <text x="44" y="128" font-size="13" class="mono">meta/</text>

  <!-- The link: present until step 4 -->
  <g data-hide="4">
    <rect x="30" y="150" width="200" height="40" rx="6" class="fill-surface stroke-ref" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="44" y="175" font-size="13" font-weight="700" class="mono">ref →</text>
    <text x="96" y="175" font-size="12" class="fill-muted">holds only a path</text>
    <path d="M232,170 C 300,170 300,96 368,96" fill="none" class="stroke-ref" stroke-width="2" marker-end="url(#symlink-arrow)"/>
  </g>
  <g data-show="4">
    <rect x="30" y="150" width="200" height="40" rx="6" fill="none" class="stroke-line" stroke-dasharray="3 4"/>
    <text x="44" y="175" font-size="12" class="fill-muted">(link removed)</text>
  </g>

  <!-- The shared folder -->
  <rect x="370" y="20" width="340" height="196" rx="12" class="fill-ref-soft stroke-ref" stroke-width="1.25"/>
  <text x="386" y="44" font-size="13" font-weight="700" class="mono">~/bioinf-shared/references/</text>
  <text x="402" y="62" font-size="13" font-weight="700" class="mono">yeast_R64-1-1_test/</text>
  <text x="694" y="44" font-size="12" text-anchor="end" class="fill-muted">protected</text>
  <text x="394" y="92" font-size="13" class="mono">README.md</text>
  <text x="394" y="116" font-size="13" class="mono">checksums.md5</text>
  <text x="394" y="140" font-size="13" class="mono">genes.gtf.gz</text>
  <text x="394" y="164" font-size="13" class="mono">genome.fa.gz</text>
  <text x="394" y="198" font-size="12" class="fill-muted">one copy, used by every project</text>

  <!-- Step 2: reading goes through the link -->
  <g data-show="2" data-hide="3">
    <path d="M650,242 C 650,150 610,128 512,128" fill="none" class="stroke-muted" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#symlink-arrow-muted)"/>
  </g>

  <!-- Step 3: a write is refused -->
  <g data-show="3" data-hide="4">
    <path d="M650,242 L 650,104" fill="none" class="stroke-muted" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#symlink-arrow-muted)"/>
    <rect x="480" y="76" width="200" height="24" rx="4" class="fill-surface stroke-ink"/>
    <text x="490" y="93" font-size="12">✗ Permission denied</text>
  </g>

  <!-- Terminal strip: one line per step -->
  <rect x="10" y="244" width="700" height="78" rx="10" class="fill-surface stroke-ink" stroke-width="1.25"/>
  <text x="26" y="266" font-size="12" font-weight="700" letter-spacing="1" class="fill-muted">TERMINAL, IN ~/bioinf-book</text>
  <g data-hide="2" font-size="13">
    <text x="26" y="290" class="mono">ls -l data/ref</text>
    <text x="26" y="310" class="mono fill-muted">data/ref -> /home/you/bioinf-shared/references/yeast_R64-1-1_test</text>
  </g>
  <g data-show="2" data-hide="3" font-size="13">
    <text x="26" y="290" class="mono">ls data/ref/</text>
    <text x="26" y="310" class="mono fill-muted">checksums.md5  genes.gtf.gz  genome.fa.gz  README.md</text>
  </g>
  <g data-show="3" data-hide="4" font-size="13">
    <text x="26" y="290" class="mono">echo "my note" >> data/ref/README.md</text>
    <text x="26" y="310" class="mono fill-muted">bash: data/ref/README.md: Permission denied</text>
  </g>
  <g data-show="4" font-size="13">
    <text x="26" y="290" class="mono">unlink data/ref</text>
    <text x="26" y="310" class="fill-muted">no output; ls ~/bioinf-shared/references/yeast_R64-1-1_test still lists all four files</text>
  </g>
</svg>
