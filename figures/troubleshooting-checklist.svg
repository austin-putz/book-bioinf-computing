  <g data-show="7">
    <line x1="32" y1="329" x2="32" y2="350" class="stroke-muted" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow)"/>
    <rect x="56" y="346" width="520" height="42" rx="6" class="fill-surface stroke-line"/>
    <circle cx="32" cy="366" r="14" class="fill-surface stroke-ink" stroke-width="1.5"/>
    <text x="32" y="371" font-size="14" font-weight="700" text-anchor="middle">7</text>
    <text x="68" y="363" font-size="14" font-weight="700">Make it small</text>
    <text x="68" y="380" font-size="12.5" class="mono fill-muted">100 reads · one sample · does it still fail?</text>
    <line x1="580" y1="366" x2="616" y2="366" class="stroke-good" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow-good)"/>
    <rect x="620" y="354" width="60" height="24" rx="12" class="fill-good-soft stroke-good"/>
    <text x="650" y="371" font-size="13" text-anchor="middle">stop</text>
  </g>
  <g data-show="3">
    <rect x="462" y="144" width="104" height="30" rx="6" class="fill-given-soft stroke-given"/>
    <text x="514" y="157" font-size="12" text-anchor="middle">case:</text>
    <text x="514" y="170" font-size="12" text-anchor="middle" class="mono">wrong folder</text>
  </g>
  <g data-show="4">
    <rect x="462" y="196" width="104" height="30" rx="6" class="fill-given-soft stroke-given"/>
    <text x="514" y="209" font-size="12" text-anchor="middle">case:</text>
    <text x="514" y="222" font-size="12" text-anchor="middle" class="mono">*.fq.gz</text>
