<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" role="img" aria-labelledby="troubleshooting-checklist-title"
     data-step-labels="Read|Log|Where|Inputs|Resources|Changes|Small">
  <title id="troubleshooting-checklist-title">A troubleshooting checklist in seven steps, each with an exit when the problem is solved. 1, read the message, all of it. 2, find the log. 3, where am I, with what: pwd, hostname, ls, pixi run or not. 4, do the inputs exist and look right: ls -l, head, gzip -t, md5sum -c. 5, are resources short: disk space, quota, time limit, Killed. 6, what changed since it last worked. 7, make it small: 100 reads, one sample. The wrong-folder case stops at step 3 and the unmatched *.fq.gz case at step 4. If the problem is still not solved after step 7, leave the checklist and ask for help.</title>
  <desc data-caption="1">Step 1. Read the whole message: who printed it, what failed, and on what. Often that is enough, and you stop.</desc>
  <desc data-caption="2">Step 2. Not solved? Find the log. The terminal may show only the last lines; a log can hold the first error.</desc>
  <desc data-caption="3">Step 3. Check where you are and with which software. The wrong-folder case stops here: pwd shows you are not in the project.</desc>
  <desc data-caption="4">Step 4. Check that the inputs exist and look right. The *.fq.gz case stops here: ls shows the files end in .fastq.gz.</desc>
  <desc data-caption="5">Step 5. Check resources: disk space, quota, time, memory.</desc>
  <desc data-caption="6">Step 6. Ask what changed since it last worked: data, versions, folders, machines.</desc>
  <desc data-caption="7">Step 7. Make it small. Still stuck after that? Leave the checklist and ask, with what you checked.</desc>
  <defs>
    <marker id="troubleshooting-checklist-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-muted"/>
    </marker>
    <marker id="troubleshooting-checklist-arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-good"/>
    </marker>
  </defs>
  <text x="650" y="20" font-size="13" text-anchor="middle" class="fill-good" font-weight="700">solved?</text>
  <g data-show="1">
    <rect x="56" y="34" width="520" height="42" rx="6" class="fill-surface stroke-line"/>
    <circle cx="32" cy="54" r="14" class="fill-surface stroke-ink" stroke-width="1.5"/>
    <text x="32" y="59" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="68" y="51" font-size="14" font-weight="700">Read the message, all of it</text>
    <text x="68" y="68" font-size="12.5" class="mono fill-muted">who, what, on what; the earliest relevant failure</text>
    <line x1="580" y1="54" x2="616" y2="54" class="stroke-good" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow-good)"/>
    <rect x="620" y="42" width="60" height="24" rx="12" class="fill-good-soft stroke-good"/>
    <text x="650" y="59" font-size="13" text-anchor="middle">stop</text>
  </g>
  <g data-show="2">
    <line x1="32" y1="69" x2="32" y2="90" class="stroke-muted" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow)"/>
    <rect x="56" y="86" width="520" height="42" rx="6" class="fill-surface stroke-line"/>
    <circle cx="32" cy="106" r="14" class="fill-surface stroke-ink" stroke-width="1.5"/>
    <text x="32" y="111" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="68" y="103" font-size="14" font-weight="700">Find the log</text>
    <text x="68" y="120" font-size="12.5" class="mono fill-muted">the terminal · logs/ · later: slurm-&lt;jobid&gt;.out</text>
    <line x1="580" y1="106" x2="616" y2="106" class="stroke-good" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow-good)"/>
    <rect x="620" y="94" width="60" height="24" rx="12" class="fill-good-soft stroke-good"/>
    <text x="650" y="111" font-size="13" text-anchor="middle">stop</text>
  </g>
  <g data-show="3">
    <line x1="32" y1="121" x2="32" y2="142" class="stroke-muted" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow)"/>
    <rect x="56" y="138" width="520" height="42" rx="6" class="fill-surface stroke-line"/>
    <circle cx="32" cy="158" r="14" class="fill-surface stroke-ink" stroke-width="1.5"/>
    <text x="32" y="163" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="68" y="155" font-size="14" font-weight="700">Where am I, with what?</text>
    <text x="68" y="172" font-size="12.5" class="mono fill-muted">pwd · hostname · ls · pixi run or not?</text>
    <line x1="580" y1="158" x2="616" y2="158" class="stroke-good" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow-good)"/>
    <rect x="620" y="146" width="60" height="24" rx="12" class="fill-good-soft stroke-good"/>
    <text x="650" y="163" font-size="13" text-anchor="middle">stop</text>
  </g>
  <g data-show="4">
    <line x1="32" y1="173" x2="32" y2="194" class="stroke-muted" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow)"/>
    <rect x="56" y="190" width="520" height="42" rx="6" class="fill-surface stroke-line"/>
    <circle cx="32" cy="210" r="14" class="fill-surface stroke-ink" stroke-width="1.5"/>
    <text x="32" y="215" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="68" y="207" font-size="14" font-weight="700">Do the inputs exist and look right?</text>
    <text x="68" y="224" font-size="12.5" class="mono fill-muted">ls -l · head · gzip -t · md5sum -c</text>
    <line x1="580" y1="210" x2="616" y2="210" class="stroke-good" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow-good)"/>
    <rect x="620" y="198" width="60" height="24" rx="12" class="fill-good-soft stroke-good"/>
    <text x="650" y="215" font-size="13" text-anchor="middle">stop</text>
  </g>
  <g data-show="5">
    <line x1="32" y1="225" x2="32" y2="246" class="stroke-muted" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow)"/>
    <rect x="56" y="242" width="520" height="42" rx="6" class="fill-surface stroke-line"/>
    <circle cx="32" cy="262" r="14" class="fill-surface stroke-ink" stroke-width="1.5"/>
    <text x="32" y="267" font-size="14" font-weight="700" text-anchor="middle">5</text>
    <text x="68" y="259" font-size="14" font-weight="700">Are resources short?</text>
    <text x="68" y="276" font-size="12.5" class="mono fill-muted">disk space · quota · time limit · Killed</text>
    <line x1="580" y1="262" x2="616" y2="262" class="stroke-good" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow-good)"/>
    <rect x="620" y="250" width="60" height="24" rx="12" class="fill-good-soft stroke-good"/>
