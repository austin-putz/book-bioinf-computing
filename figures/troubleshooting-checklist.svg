  <g data-show="7">
    <line x1="32" y1="381" x2="32" y2="408" class="stroke-muted" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow)"/>
    <rect x="12" y="412" width="564" height="46" rx="8" class="fill-surface stroke-ink" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="28" y="432" font-size="14" font-weight="700">Still stuck? Leave the checklist and ask.</text>
    <text x="28" y="450" font-size="13" class="fill-muted">Search first, then write a help request that says what you checked.</text>
