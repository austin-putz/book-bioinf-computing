    <text x="68" y="311" font-size="14" font-weight="700">What changed since it last worked?</text>
    <text x="68" y="328" font-size="12.5" class="mono fill-muted">new data · new version · new folder · new machine</text>
    <line x1="580" y1="314" x2="616" y2="314" class="stroke-good" stroke-width="1.5" marker-end="url(#troubleshooting-checklist-arrow-good)"/>
    <rect x="620" y="302" width="60" height="24" rx="12" class="fill-good-soft stroke-good"/>
    <text x="650" y="319" font-size="13" text-anchor="middle">stop</text>
