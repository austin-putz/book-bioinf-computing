<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="vim-modes-title">
  <title id="vim-modes-title">vim's two modes for beginners. vim starts in Normal mode, where keys are commands. Pressing i enters Insert mode, where keys type text; pressing Esc returns to Normal mode. From Normal mode, :wq saves and quits, :q! quits without saving, and :cq quits with an error, which tells the program that opened vim, such as git commit, to stop.</title>
  <defs>
    <marker id="vim-modes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-muted"/>
    </marker>
  </defs>

  <!-- Start -->
  <text x="20" y="96" font-size="13" class="mono">vim notes.txt</text>
  <text x="20" y="116" font-size="12" class="fill-muted">starts here</text>
  <line x1="130" y1="100" x2="196" y2="100" class="stroke-muted" stroke-width="1.75" marker-end="url(#vim-modes-arrow)"/>

  <!-- Normal mode -->
  <rect x="198" y="56" width="190" height="88" rx="12" class="fill-surface stroke-ink" stroke-width="1.5"/>
  <text x="293" y="92" font-size="16" font-weight="700" text-anchor="middle">Normal mode</text>
  <text x="293" y="114" font-size="13" text-anchor="middle" class="fill-muted">keys are commands</text>

  <!-- Insert mode -->
  <rect x="510" y="56" width="190" height="88" rx="12" class="fill-surface stroke-ink" stroke-width="1.5"/>
  <text x="605" y="92" font-size="16" font-weight="700" text-anchor="middle">Insert mode</text>
  <text x="605" y="114" font-size="13" text-anchor="middle" class="fill-muted">keys type text</text>

  <!-- i: Normal to Insert; Esc: Insert to Normal -->
  <path d="M388,78 C430,50 468,50 508,78" fill="none" class="stroke-muted" stroke-width="1.75" marker-end="url(#vim-modes-arrow)"/>
  <text x="449" y="46" font-size="14" font-weight="700" text-anchor="middle" class="mono">i</text>
  <path d="M510,122 C468,150 430,150 390,122" fill="none" class="stroke-muted" stroke-width="1.75" marker-end="url(#vim-modes-arrow)"/>
  <text x="449" y="166" font-size="14" font-weight="700" text-anchor="middle" class="mono">Esc</text>

  <!-- Exits from Normal mode -->
  <line x1="293" y1="144" x2="293" y2="192" class="stroke-muted" stroke-width="1.75" marker-end="url(#vim-modes-arrow)"/>
  <rect x="120" y="194" width="580" height="96" rx="10" class="fill-surface stroke-line"/>
  <text x="136" y="216" font-size="12" font-weight="700" letter-spacing="1" class="fill-muted">TO QUIT, FROM NORMAL MODE (then Enter)</text>
  <g font-size="13">
    <text x="136" y="240" font-weight="700" class="mono">:wq</text>
    <text x="196" y="240">save and quit</text>
    <text x="136" y="260" font-weight="700" class="mono">:q!</text>
    <text x="196" y="260">quit without saving</text>
    <text x="136" y="280" font-weight="700" class="mono">:cq</text>
    <text x="196" y="280">quit with an error: the tool that opened vim (e.g., <tspan class="mono">git commit</tspan>) stops</text>
  </g>
</svg>
