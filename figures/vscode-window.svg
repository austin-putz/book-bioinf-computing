<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="vscode-window-title">
  <title id="vscode-window-title">A simplified VS Code window with four labelled areas. On the left, the explorer lists the files of the open folder, bioinf-computing: pixi.lock, pixi.toml, and notes.txt. On the right, the editor shows pixi.toml. Below the editor, the terminal panel runs bash and shows pixi run check printing Python 3.12.16. Along the bottom, the status bar; its left end reads WSL: Ubuntu, which shows where VS Code is connected.</title>
  <defs>
    <marker id="vscode-window-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-muted"/>
    </marker>
  </defs>

  <!-- Window frame and title bar -->
  <rect x="10" y="10" width="700" height="336" rx="10" class="fill-surface stroke-ink" stroke-width="1.25"/>
  <line x1="10" y1="38" x2="710" y2="38" class="stroke-line"/>
  <g class="fill-line">
    <circle cx="30" cy="24" r="5"/>
    <circle cx="48" cy="24" r="5"/>
    <circle cx="66" cy="24" r="5"/>
  </g>
  <text x="360" y="29" font-size="12" text-anchor="middle" class="fill-muted">pixi.toml — bioinf-computing</text>

  <!-- Explorer -->
  <rect x="10" y="38" width="190" height="270" class="fill-muted-soft"/>
  <line x1="200" y1="38" x2="200" y2="308" class="stroke-line"/>
  <text x="24" y="62" font-size="12" font-weight="700" letter-spacing="1" class="fill-muted">EXPLORER</text>
  <text x="24" y="88" font-size="13" font-weight="700">BIOINF-COMPUTING</text>
  <g font-size="13" class="mono">
    <text x="38" y="112">.pixi</text>
    <text x="38" y="134">notes.txt</text>
    <text x="38" y="156">pixi.lock</text>
    <text x="38" y="178">pixi.toml</text>
  </g>
  <text x="24" y="290" font-size="12" class="fill-muted">files in the folder</text>

  <!-- Editor -->
  <rect x="200" y="38" width="130" height="28" class="fill-surface stroke-line"/>
  <text x="214" y="57" font-size="13" class="mono">pixi.toml</text>
  <line x1="330" y1="66" x2="710" y2="66" class="stroke-line"/>
  <g font-size="13" class="mono">
    <text x="218" y="92">[workspace]</text>
    <text x="218" y="112">name = "bioinf-computing"</text>
    <text x="218" y="132">channels = ["conda-forge", "bioconda"]</text>
    <text x="218" y="152">…</text>
  </g>
  <text x="694" y="92" font-size="12" font-weight="700" letter-spacing="1" text-anchor="end" class="fill-muted">EDITOR</text>
  <text x="694" y="110" font-size="12" text-anchor="end" class="fill-muted">the open file</text>

  <!-- Terminal panel -->
  <line x1="200" y1="182" x2="710" y2="182" class="stroke-line"/>
  <text x="218" y="204" font-size="12" font-weight="700" letter-spacing="1" class="fill-muted">TERMINAL</text>
  <g font-size="13" class="mono">
    <text x="218" y="230">pixi run check</text>
    <text x="218" y="250" class="fill-muted">Python 3.12.16</text>
    <text x="218" y="270" class="fill-muted">…</text>
  </g>
  <text x="694" y="204" font-size="12" font-weight="700" letter-spacing="1" text-anchor="end" class="fill-muted">TERMINAL PANEL</text>
  <text x="694" y="222" font-size="12" text-anchor="end" class="fill-muted">bash, in the open folder</text>

  <!-- Status bar -->
  <line x1="10" y1="308" x2="710" y2="308" class="stroke-line"/>
  <rect x="11" y="309" width="118" height="36" class="fill-given-soft stroke-given" stroke-width="1.25"/>
  <text x="70" y="332" font-size="13" text-anchor="middle" class="mono fill-given">WSL: Ubuntu</text>
  <text x="694" y="332" font-size="12" font-weight="700" letter-spacing="1" text-anchor="end" class="fill-muted">STATUS BAR</text>

  <!-- Annotation: where you are connected -->
  <line x1="70" y1="376" x2="70" y2="349" class="stroke-muted" stroke-width="1.5" marker-end="url(#vscode-window-arrow)"/>
  <text x="84" y="378" font-size="13">where VS Code is connected (desktop app): <tspan class="mono">WSL: Ubuntu</tspan>, <tspan class="mono">SSH: &lt;host&gt;</tspan>, or nothing</text>
  <text x="84" y="395" font-size="12" class="fill-muted">in a browser only an icon shows here: run <tspan class="mono">hostname</tspan> in the terminal instead</text>
</svg>
