# misconceptions.yml ------------------------------------------------------
# What students actually get wrong, and where the book confronts it.
# Format from ../../animal-models-test/misconceptions.yml. Misconception
# callouts (STYLE-GUIDE §3) and self-check probes are written FROM this
# file, not invented per chapter. Chapter plans list new entries; add them
# here when the plan is agreed.
#
# Fields:
#   id        stable slug, cited from chapters as {#mis-<id>}
#   claim     the wrong belief, in a student's own voice
#   reality   the correction
#   probe     an item that separates students who hold the belief from those who don't
#   chapters  where it is raised (first entry = where it is confronted head-on)

# Chapter 1 -----------------------------------------------------------------

- id: more-cores-faster
  claim: "More cores always makes it faster."
  reality: >
    Only steps written to use several threads get faster, and only until
    something else limits them. Many steps use one core, and some are
    limited by disk, network, or memory rather than the CPU.
  probe: >
    A step keeps one core at 100% while seven sit idle. Will rerunning it
    with --threads 8 make it faster? (Correct: only if the tool supports
    threads; if it does not, nothing changes.)
  chapters: [01-orientation, 10-hpc-slurm, 35-performance]

- id: cluster-faster-computer
  claim: "The cluster is just a faster computer."
  reality: >
    A cluster is many ordinary computers shared by many people. You ask a
    scheduler for cores, memory, and time, and your job waits in a queue
    until they are free. A single step is often no faster than on a laptop;
    the gain is running many steps at once, with more memory.
  probe: >
    You submit one single-threaded job to the cluster. Why might it finish
    later than the same job on your laptop? (Correct: it waits in the queue,
    and one core on a compute node is not much faster than a laptop core.)
  chapters: [01-orientation, 10-hpc-slurm]

- id: run-on-login-node
  claim: "I can run my analysis on the login node."
  reality: >
    The login node is a shared doorway for editing files and submitting
    jobs. Heavy work there slows it for everyone, and many sites kill
    long-running processes on it. Analysis runs on compute nodes.
  probe: >
    You have just logged in to the cluster. Where should an alignment of
    48 samples run, and how do you get it there? (Correct: on compute nodes,
    by submitting a job to the scheduler.)
  chapters: [10-hpc-slurm, 01-orientation, 07-linux-system, 09-working-remotely]

- id: ram-is-disk
  claim: "RAM and disk storage are the same thing."
  reality: >
    RAM is the fast working space a program uses while it runs; it is
    small and emptied when the program stops. Disk is slow, large, and
    keeps files. Running out of RAM gets a job killed; running out of disk
    gives "No space left on device". A file's size on disk is also not the
    RAM a program needs: many tools stream through a file without loading
    it.
  probe: >
    A job stops with the message "Killed" and no output file. Which
    resource most likely ran out? (Correct: RAM, not disk.)
  chapters: [01-orientation, 10-hpc-slurm]

- id: learn-commands-first
  claim: "I need to learn the commands before I can try anything."
  reality: >
    You can run a working analysis by copying commands and checking the
    output. Understanding comes from seeing it work first, then learning
    what each part does (Part II).
  probe: >
    (Not probed by a question; Chapter 1's guided session confronts it by
    having readers run commands before they are explained.)
  chapters: [01-orientation]

- id: windows-needs-linux-pc
  claim: "Windows users need a separate Linux computer."
  reality: >
    WSL2 runs a real Linux system (e.g., Ubuntu) inside Windows. Every
    command in this book works there.
  probe: >
    A classmate on Windows asks whether they need to buy a Linux laptop for
    this course. What do you tell them? (Correct: no; install WSL2 with
    Ubuntu.)
  chapters: [01-orientation]

# Chapter 2 -----------------------------------------------------------------

- id: installed-everywhere
  claim: "Once I install a tool, it works in every terminal."
  reality: >
    Installing the book environment does not add its tools to every
    terminal. `pixi run` runs one command with the environment; `pixi shell`
    starts a shell with it until you type `exit`.
  probe: >
    In a fresh terminal in the book folder, `seqkit stats` says "command not
    found", but `pixi run seqkit stats` works, and you have not installed
    seqkit any other way. Why? (Correct: the environment is only active
    through `pixi run` or `pixi shell`.)
  chapters: [02-book-setup, 07-linux-system, 23-environments]

- id: need-sudo-to-install
  claim: "I need admin rights (sudo) to install the tools I use."
  reality: >
    Analysis tools install into your own space with pixi or conda, which is
    the normal way on a cluster where you never have sudo. Some system
    components and container runtimes do need your site's admins.
  probe: >
    On the cluster, `sudo apt install samtools` fails with "not in the
    sudoers file". What do you do? (Correct: install it into your own
    environment with pixi or conda, or use the site's module; not ask for
    sudo.)
  chapters: [02-book-setup, 07-linux-system, 23-environments]

- id: remote-runs-on-laptop
  claim: "With VS Code connected to the cluster, my code runs on my laptop."
  reality: >
    The window is local; a VS Code server runs on the remote machine, and
    the files, terminal, and most extensions are there. Laptop files and
    the laptop's environment are not copied over.
  probe: >
    In a VS Code window connected to the cluster you open a terminal and run
    `ls ~/bioinf-computing`, a folder on your laptop. What happens? (Correct:
    "No such file or directory", unless you made that folder on the
    cluster too.)
  chapters: [02-book-setup, 09-working-remotely]

- id: closing-tab-ends-session
  claim: "Closing the browser tab ends my Open OnDemand session."
  reality: >
    The session is a cluster job that keeps its compute node until you
    click Cancel on its card in My Interactive Sessions or it reaches its
    time limit. Closing the tab only closes your view of it (checked on
    Nova, 2026-11-16).
  probe: >
    You close the VS Code tab and reopen My Interactive Sessions. What does
    the card say, and how do you free the node? (Correct: still Running
    with time remaining; click Cancel.)
  chapters: [02-book-setup, 10-hpc-slurm]

- id: ide-required
  claim: "I need RStudio for R and Jupyter for Python."
  reality: >
    Any editor plus a terminal runs both. VS Code edits R and Python
    scripts, runs notebooks, and renders Quarto; RStudio and Jupyter are
    options, not requirements.
  probe: >
    (Not probed by a question; Chapter 2's reference table and Chapters
    12-13 confront it by running R and Python from VS Code.)
  chapters: [02-book-setup, 12-r-essentials, 13-python-essentials]

- id: stuck-in-vim
  claim: "If vim opens, I have to close the terminal to get out."
  reality: >
    Press Esc, type `:q!`, press Enter to quit without saving. To make the
    tool that opened vim (such as `git commit`) stop, use `:cq` instead.
  probe: >
    A command opened vim and the screen fills with `~` lines. How do you
    leave without saving? (Correct: Esc, `:q!`, Enter.)
  chapters: [02-book-setup, 08-shell-scripts]

# Chapter 4 -----------------------------------------------------------------

- id: no-error-means-correct
  claim: "If no error appears, the result is right."
  reality: >
    Warnings let runs continue, and some tool versions report success
    after printing an error (seqkit 2.14.0 on a truncated file exits 0).
    Check outputs against something you know: a read count, a file size,
    a number from the paper.
  probe: >
    `as.integer(c("12","7","n/a"))` finished without an error. Is the
    result fine? (Correct: only if `n/a` means missing in that column.)
  chapters: [04-getting-help, 08-shell-scripts, 10-hpc-slurm]

- id: last-line-is-the-error
  claim: "The last line of the output is the error that matters."
  reality: >
    Look for the earliest relevant failure in this run; later lines are
    often consequences, and the useful detail can sit in a warning after
    the error (R's `cannot open file ...` warning).
  probe: >
    R prints `Error in file(file, "rt") : cannot open the connection`,
    then a warning. Where is the name of the missing file? (Correct: in
    the warning, after the error.)
  chapters: [04-getting-help, 10-hpc-slurm, 26-nf-core]

- id: asking-is-failure
  claim: "Asking for help means I wasn't good enough to solve it."
  reality: >
    Everyone asks. A well-made request is a skill, and some problems
    (broken nodes, quotas, accounts) only administrators can fix.
  probe: >
    A module that loaded yesterday will not load today, and you changed
    nothing. Keep trying for a day, or report it? (Correct: report it
    with what you saw and checked; you need not know the cause.)
  chapters: [04-getting-help]

- id: screenshot-is-fine
  claim: "A screenshot of the error is the easiest way to ask."
  reality: >
    Text can be searched, copied, quoted, and read by screen readers;
    screenshots crop the first error and hide the command. A screenshot
    can add to text (a dialog, a panel), not replace it.
  probe: >
    Why paste the error as text? (Correct: searchable, quotable,
    accessible, and it keeps the first line and the command.)
  chapters: [04-getting-help, 22-github]

- id: ai-code-is-tested
  claim: "Code from an AI assistant works; I can assume it has been tested."
  reality: >
    It is generated text. Flags can be invented or belong to another
    version, and even code described as tested may have been tested on
    other inputs or another system. Check flags in `--help` and
    reproduce a known result.
  probe: >
    An assistant suggests `seqkit stats --count-pairs`. What do you check
    first? (Correct: that the flag is in `seqkit stats --help` for your
    version; in 2.14.0 it is not.)
  chapters: [04-getting-help]

- id: docs-match-my-version
  claim: "The online documentation describes the version I have installed."
  reality: >
    Websites usually show the latest release. Check your version
    (`--version`, `pixi list`) and use `--help`, which comes from the
    program you run.
  probe: >
    A flag from the tool's website gives `unknown flag`. What is the
    likely reason? (Correct: your installed version is older than the
    one the website describes.)
  chapters: [04-getting-help, 23-environments]

# Chapter 3 -----------------------------------------------------------------

- id: checksum-proves-correct
  claim: "If the checksums match, my data are correct."
  reality: >
    A match proves the file is byte-for-byte the one the checksum was made
    from. It says nothing about whether that file was the right sample or
    good data.
  probe: >
    A facility mislabelled a file before computing its MD5. Does
    `md5sum -c` catch the mistake? (Correct: no; it prints OK.)
  chapters: [03-organizing-projects, 09-working-remotely, 20-reference-data]

- id: symlink-is-copy
  claim: "A symbolic link is a copy, so editing or deleting through it is safe."
  reality: >
    A link is another route to the same data. Writing through it changes
    the original, and `rm -r link/` with a trailing slash can delete the
    target (captured 2026-11-17: on macOS the whole folder, on Ubuntu every
    file inside it). Remove only the link with
    `unlink link` or `rm link`, no slash.
  probe: >
    You run `unlink data/ref`. Is the reference genome gone? (Correct: no,
    only the link.)
  chapters: [03-organizing-projects, 05-shell-basics]

- id: readonly-cant-delete
  claim: "A read-only file can't be deleted."
  reality: >
    Deleting, moving, and adding files change the folder, so they need
    `w` and `x` on the folder; the file's own permissions do not matter.
    Protect the folder as well as the files.
  probe: >
    A file is read-only but its folder is writable. Does `rm -f file`
    remove it? (Correct: yes.) Second probe: a folder you own is
    `drw-r--r--` (no `x`); can you `cat` a readable file inside it?
    (Correct: no; without `x` you can list the names but not reach the
    entries.)
  chapters: [07-linux-system, 03-organizing-projects]

- id: cluster-is-backed-up
  claim: "Everything on the cluster is backed up."
  reality: >
    Scratch is purged and never backed up. Which other areas are backed up
    or snapshotted, and for how long, differs by site; SCINet backs up none
    of its cluster storage.
  probe: >
    Your only copy of the raw reads is in `/90daydata`. What happens in
    three months? (Correct: they are deleted permanently.)
  chapters: [03-organizing-projects, 10-hpc-slurm]

- id: sync-is-backup
  claim: "My Dropbox/OneDrive/Google Drive folder is my backup."
  reality: >
    Sync copies deletions and overwrites to every device: one copy in two
    places, protected only by version history for as long as the service
    keeps it.
  probe: >
    You overwrite a file in your OneDrive folder by mistake. Is the old
    version safe? (Correct: only if version history still holds it.)
  chapters: [03-organizing-projects]

- id: ill-remember
  claim: "I'll remember where this file came from and how I made it."
  reality: >
    Weeks later no one does. Record source, version, checksum, script,
    command, software, and a log when the file is made.
  probe: >
    A reviewer asks which seqkit version made a table. Where do you look?
    (Correct: the run's log and the lockfile; not memory.)
  chapters: [03-organizing-projects, 23-environments]

# Chapter 5 -----------------------------------------------------------------

- id: relative-to-script
  claim: "A relative path is relative to the script (or file) that contains it."
  reality: >
    A relative path is read from the current working directory of the
    shell that runs the command, wherever the script itself is stored.
  probe: >
    From `~` you run `bash ~/bioinf-computing-ch05/where.sh`, which
    contains `ls data/raw`. Which folder does `ls` look in? (Correct:
    `~/data/raw`, which does not exist; captured 2026-11-17:
    `ls: cannot access 'data/raw'`.)
  chapters: [05-shell-basics, 04-getting-help, 08-shell-scripts]

- id: rm-has-undo
  claim: "Deleted files go to a trash folder I can restore them from."
  reality: >
    `rm` removes the name at once. There is no trash on the command line;
    only backups or site snapshots can bring a file back.
  probe: >
    You `rm` a results file by mistake on a cluster. Where do you look?
    (Correct: not in a trash folder; ask whether your site keeps
    snapshots of that storage, or rerun from the raw data.)
  chapters: [05-shell-basics, 03-organizing-projects]

- id: cp-mv-warn
  claim: "`cp` and `mv` warn me before they overwrite a file."
  reality: >
    They overwrite silently unless given `-i` (ask) or `-n` (never
    overwrite).
  probe: >
    What does `mv new.tsv old.tsv` do if `old.tsv` already exists?
    (Correct: replaces it without a question.)
  chapters: [05-shell-basics]

- id: program-sees-wildcard
  claim: "The program reads the `*` and finds the matching files itself."
  reality: >
    For an unquoted pattern, bash expands it before the program starts;
    the program gets the matching names, or the unchanged pattern when
    nothing matches. Only a quoted pattern reaches the program, which
    some programs (`find -name`) want.
  probe: >
    Why did seqkit's error in Chapter 4 contain a literal `*.fq.gz`?
    (Correct: nothing matched, so bash passed the pattern on unchanged.)
  chapters: [05-shell-basics, 04-getting-help, 08-shell-scripts]

- id: open-to-look
  claim: "To see what is in a file, I open it in an editor."
  reality: >
    Large files can freeze an editor and compressed ones show noise.
    `head`, `less`, and `file` let you look without loading the whole
    file into an editor.
  probe: >
    How do you see the first read of a 10 GB `.fastq.gz`? (Correct:
    `gunzip -c file | head -n 4`, or `zless`.)
  chapters: [05-shell-basics, 15-fasta-fastq]

# Chapter 6 -----------------------------------------------------------------

- id: redirect-to-same-file
  claim: "`sort data.txt > data.txt` sorts the file in place."
  reality: >
    The shell opens and empties `data.txt` before `sort` starts, so
    `sort` reads an empty file and the result is empty. Write to a new
    file, check it, then `mv` it into place.
  probe: >
    What is in `toy.txt` after `sort toy.txt > toy.txt`? (Correct:
    nothing; it is 0 bytes.)
  chapters: [06-text-tools, 08-shell-scripts]

- id: errors-go-to-file
  claim: "`> file` saves everything the command prints."
  reality: >
    It saves standard output only. Messages on standard error (progress,
    warnings, errors) still go to the screen and are not in the file;
    use `2>` to capture them.
  probe: >
    After `pixi run seqkit stats -T … > counts.tsv`, a progress line is
    still on screen. Why? (Correct: it was written to standard error,
    which `>` does not redirect.)
  chapters: [06-text-tools, 08-shell-scripts, 10-hpc-slurm]

- id: pipe-stops-on-error
  claim: "If one command in a pipeline fails, the pipeline fails."
  reality: >
    By default the pipeline's exit status is the last command's, and
    later commands keep working on whatever partial output they got.
    `set -o pipefail` (Chapter 8) reports a failing stage, but cannot
    catch a tool that reports success despite an error.
  probe: >
    `gunzip -c broken.fastq.gz | wc -l` prints an error and a number
    (89515 with GNU gzip 1.15). What does `echo $?` print, and is the
    number a read count? (Correct: `0`; no, it counts partial output.)
  chapters: [06-text-tools, 08-shell-scripts]

- id: uniq-finds-all-duplicates
  claim: "`uniq` removes or counts all duplicate lines."
  reality: >
    It only merges identical lines that are next to each other. Sort
    first, so equal values are counted wherever they are in the file.
  probe: >
    `cut -f1 samples.tsv | uniq -c` on the practice table shows
    `sample_B` twice with count 1. Why? (Correct: the two rows are not
    adjacent; use `sort | uniq -c`.)
  chapters: [06-text-tools]

- id: sort-is-numeric
  claim: "`sort` puts numbers in numeric order."
  reality: >
    By default it compares text character by character, so `105` sorts
    before `12` and `10091` before `1807`. Use `sort -n`, and `-k` to
    pick the column.
  probe: >
    The practice table's read counts sort as `105 12 30 30 8 9`. What
    went wrong? (Correct: text order; use `sort -t$'\t' -k4,4n`.)
  chapters: [06-text-tools, 08-shell-scripts, 14-tabular-data]

- id: grep-at-counts-reads
  claim: "`grep -c '^@'` counts the reads in a FASTQ file."
  reality: >
    `@` is also a quality character (Phred 31), so a quality line can
    start with it. It happened to work on the book's file. Count by line
    position in a four-line file, or use `seqkit stats` in general.
  probe: >
    A 2-read FASTQ file gives `grep -c '^@'` = 3. How? (Correct: one
    quality line starts with `@`.)
  chapters: [06-text-tools, 15-fasta-fastq]

- id: glob-is-regex
  claim: "`*` means the same in `grep` as in `ls`."
  reality: >
    In a glob (`ls`, `find -name`) `*` means "any characters". In a
    regular expression `*` means "zero or more of the previous
    character", and `.` means "any one character".
  probe: >
    Does `grep 'fastq.gz'` match `fastqXgz`? (Correct: yes; `.` matches
    any character. Use `'fastq\.gz'` or `grep -F`.)
  chapters: [06-text-tools, 05-shell-basics]

- id: chmod-777-fixes
  claim: "When I get `Permission denied`, `chmod 777` (or `sudo`) is the fix."
  reality: >
    It removes protection for everyone and hides which permission was
    missing. Read the permission string and change only the missing
    letter. On a cluster `sudo` is not available.
  probe: >
    `./run.sh` says `Permission denied` and `ls -l` shows `-rw-r--r--`.
    What is the smallest fix? (Correct: `chmod u+x run.sh`.)
  chapters: [07-linux-system]

- id: script-needs-bash
  claim: "To run a script I must type `bash script.sh`."
  reality: >
    With a shebang line and the `x` bit a script runs as `./script.sh`,
    and by name once its folder is on `PATH`. `bash script.sh` ignores the
    shebang, so it runs anything as bash.
  probe: >
    `plot.py` starts with `#!/usr/bin/env python3`. What happens with
    `bash plot.py`? (Correct: bash tries to read Python as shell commands
    and fails; run `./plot.py` or `python3 plot.py`.)
  chapters: [07-linux-system, 08-shell-scripts]

- id: which-is-enough
  claim: "`which` tells me exactly what will run."
  reality: >
    `which` is a separate program whose versions differ, and it does not
    know bash's aliases or functions, which come before `PATH`. Bash's
    `type -a` shows what bash will run, in order.
  probe: >
    On Ubuntu, `which ls` prints `/usr/bin/ls`. What does typing `ls`
    actually run? (Correct: the alias `ls --color=auto`, as `type -a ls`
    shows.)
  chapters: [07-linux-system]

- id: export-is-permanent
  claim: "Once I `export` a variable, it stays set."
  reality: >
    It lasts for that shell and the programs it starts. A separately
    opened terminal does not see it; put the line in `~/.bashrc` for every
    new terminal.
  probe: >
    You run `export THREADS=4`, then open a second terminal. What does
    `echo "$THREADS"` print there? (Correct: an empty line.)
  chapters: [07-linux-system]

- id: closed-window-decides
  claim: "Closing the terminal window decides whether my command keeps running."
  reality: >
    Neither "it keeps going" nor "it always stops" is safe: it depends on
    how the program was started and how it handles signals. Long work
    belongs in tmux or a scheduler job; check with `ps -u "$USER"`.
  probe: >
    You start a 3-hour command over SSH and your laptop sleeps. Is it still
    running? (Correct: do not count on it either way; run it in tmux or as
    a job.)
  chapters: [07-linux-system, 09-working-remotely, 10-hpc-slurm]

- id: csv-is-csv
  claim: "A CSV file is a CSV file; where it was saved doesn't matter."
  reality: >
    The program and system that saved it decide its line endings (and
    whether it starts with a byte-order mark). With CRLF endings a `\r`
    sticks to the last field, so shell matches and comparisons on it fail
    silently.
  probe: >
    A sample sheet looks right in `cat`, but `grep -c ',30$'` finds 0
    rows you can see. What do you check first? (Correct: `cat -A` for
    `^M`, or `grep -c $'\r'`.)
  chapters: [07-linux-system, 08-shell-scripts, 14-tabular-data]

# Chapter 8 -----------------------------------------------------------------

- id: script-stops-on-error
  claim: "If a command in my script fails, the script stops."
  reality: >
    By default bash moves on to the next line, so later steps run on
    missing or partial results and the script can still exit 0.
    `set -e` changes that.
  probe: >
    A script without `set -e` runs `gunzip -c missing.gz | wc -l`, then
    `echo done`. What prints, and what is the exit status? (Correct: an
    error, `0`, `done`; exit 0.)
  chapters: [08-shell-scripts, 01-orientation]

- id: strict-mode-catches-all
  claim: "With `set -euo pipefail` my script stops on every error."
  reality: >
    It stops on a nonzero exit status, except in conditions, functions
    called from conditions, all but the last command of an `&&`/`||`
    list, and masked assignments such as `local x=$(…)`. It cannot see a
    tool that reports success on bad input, and it can stop on harmless
    statuses (`grep` with no match, `head` closing a pipe).
  probe: >
    Which stops a strict script: `grep -c XYZ file` with no match, or
    seqkit 2.14.0 on a truncated file? (Correct: the `grep`; seqkit
    exits 0.)
  chapters: [08-shell-scripts]

- id: quotes-are-style
  claim: "Quotes around variables are just style; the script works without them."
  reality: >
    In a command's arguments, an unquoted value is split at spaces, tabs,
    and newlines and each piece is matched as a wildcard, so a name with
    a space becomes several arguments.
  probe: >
    `f="Run 3 final/a.fq.gz"; ls $f`: how many names does `ls` get?
    (Correct: three.)
  chapters: [08-shell-scripts]

- id: typo-variable-errors
  claim: "If I misspell a variable, bash gives an error."
  reality: >
    An unset variable expands to nothing, silently, unless `set -u` is
    on. Quoting keeps the result as one argument but does not check it.
  probe: >
    What argument does `rm -rf "$outdri/"` receive if `outdri` is unset?
    (Correct: `/`.)
  chapters: [08-shell-scripts]

- id: for-reads-lines
  claim: "`for line in $(cat file)` goes through a file line by line."
  reality: >
    It goes word by word, split at spaces and tabs, and matches
    wildcards. Read lines with `while IFS= read -r line`.
  probe: >
    How many passes for a two-line file whose first line is
    `sample_C Run 3 final`? (Correct: more than two, one per word.)
  chapters: [08-shell-scripts]

- id: git-is-backup
  claim: "My scripts are in git, so they are backed up."
  reality: >
    A repository on the same disk is not an off-machine backup: a local
    `.git/` folder is lost with the disk. Pushing to another machine is
    one way to make an independent copy.
  probe: >
    Your laptop's disk fails. Your scripts were committed but never
    pushed. Are they safe? (Correct: no; the history was on the same
    disk.)
  chapters: [08-shell-scripts, 21-git, 22-github]

# Chapter 9 -----------------------------------------------------------------

- id: public-key-is-secret
  claim: "My SSH public key is a secret, and the private one is what I give to servers."
  reality: >
    It is the other way round. The public key (.pub) is meant to be
    shared and goes into authorized_keys on every server; the private
    key never leaves your laptop and is protected by a passphrase.
  probe: >
    Which file goes into ~/.ssh/authorized_keys on the cluster?
    (Correct: id_ed25519.pub, the public key.)
  chapters: [09-working-remotely, 22-github]

- id: tmux-on-login-is-a-job
  claim: "Inside tmux on the login node I can run heavy analysis, because it keeps running."
  reality: >
    tmux keeps a shell alive, but it is still the shared login node:
    heavy work there slows everyone and may be stopped by the site.
    Heavy work goes in a scheduler job, which runs without tmux.
  probe: >
    You start a six-hour alignment in tmux on the login node. What is
    wrong? (Correct: it runs on the shared login node; it belongs in a
    job.)
  chapters: [09-working-remotely, 10-hpc-slurm]

- id: rsync-slash-doesnt-matter
  claim: "`rsync src dst` and `rsync src/ dst` do the same thing."
  reality: >
    Without the slash, rsync copies the folder itself into dst
    (dst/src/...); with it, it copies the folder's contents (dst/...).
  probe: >
    Where do the files of `rsync -a results host:/data/results` end up?
    (Correct: in /data/results/results/.)
  chapters: [09-working-remotely]

- id: transfer-finished-is-verified
  claim: "If the copy finished without an error, the files are fine."
  reality: >
    A finished transfer says nothing about a file already wrong at the
    source or damaged before this copy, and some tools let you turn
    their check off. Check against the original checksum list on the
    receiving machine; a list made from the source just before copying
    proves agreement with that source only.
  probe: >
    rsync finished without errors. Do you still run md5sum -c? (Correct:
    yes, against the original list, on the receiving machine.)
  chapters: [09-working-remotely, 20-reference-data]

- id: rsync-a-copies-it-right
  claim: "`rsync -a` keeps everything as it was, so it is always the safest way to copy."
  reality: >
    Into a group project folder it keeps the wrong things: the laptop's
    permission bits and your personal group, so the files do not get
    the project's group. Add --no-p --no-g there.
  probe: >
    After `rsync -av` into /project/..., `ls -l` shows your own group on
    the files. What option fixes it? (Correct: --no-p --no-g.)
  chapters: [09-working-remotely, 10-hpc-slurm]

# Chapter 10 ----------------------------------------------------------------

- id: space-means-room
  claim: "If my quota shows free space, I can keep making files."
  reality: >
    Many systems also limit the number of files. A pixi environment is
    about 15,000 files, and a pipeline's work folder can hold millions.
    Count with `find … -type f | wc -l`, and read the site's own file
    count where it gives one.
  probe: >
    You get "Disk quota exceeded" with 400 GB free. What do you check?
    (Correct: the file-count limit, with the site's quota command, and
    which folder holds the most files.)
  chapters: [10-hpc-slurm]

- id: job-runs-in-my-shell
  claim: "A job sees my terminal as it is now."
  reality: >
    A batch job runs later, on another node, with a copy of the
    environment from when you submitted, starting in the folder you
    submitted from, with no terminal. Scripts it calls are read when it
    starts, not when you submit.
  probe: >
    You run sbatch in your project folder, then cd somewhere else. Where
    do the job's relative paths point? (Correct: the project folder you
    submitted from.)
  chapters: [10-hpc-slurm]

- id: cpus-sets-threads
  claim: "If I ask Slurm for 8 CPUs, my tool uses 8."
  reality: >
    Slurm reserves CPUs; the tool starts as many threads as its own
    option says (seqkit starts 4 by default, whatever was reserved).
    Pass $SLURM_CPUS_PER_TASK to the tool's thread option. Some sites
    also round a request up to whole cores, so check AllocCPUS in sacct.
  probe: >
    You ask for --cpus-per-task=8 and run seqkit stats with no -j. How
    many threads does seqkit use? (Correct: 4, its default; the other 4
    CPUs sit idle.)
  chapters: [10-hpc-slurm, 35-performance]

- id: ask-big-to-be-safe
  claim: "Asking for lots of memory and time is the safe choice."
  reality: >
    A big or long request can wait longer, because the scheduler fits
    smaller, shorter jobs into gaps (backfill). Resources you hold but do
    not use while the job runs are unavailable to others and can count
    toward your group's usage. Measure a test run, then add a margin.
  probe: >
    Two identical jobs, one asking for 2 hours and one for 3 days: which
    may start first, and why? (Correct: the 2-hour job, because it fits
    into more gaps; it is likely, not guaranteed.)
  chapters: [10-hpc-slurm]

- id: pending-means-broken
  claim: "My job is pending, so something is wrong."
  reality: >
    Priority and Resources are normal waiting. Only some reasons, such
    as a limit the request breaks or a failed dependency, need a fix.
    Read the reason column in squeue.
  probe: >
    Your job shows (Priority) after 20 minutes. What do you do? (Correct:
    wait; check squeue --start; ask the site only if hours pass.)
  chapters: [10-hpc-slurm]
