# misconceptions.yml ------------------------------------------------------
# What students actually get wrong, and where the book confronts it.
# Format from ../../animal-models-test/misconceptions.yml. Misconception
# callouts (STYLE-GUIDE §3) and self-check probes are written FROM this
# file, not invented per chapter. Chapter plans list new entries; add them
# here when the plan is agreed.
#
# Fields:
#   id        stable slug, cited from chapters as {#mis-<id>}
#   claim     the wrong belief, in a student's own voice
#   reality   the correction
#   probe     an item that separates students who hold the belief from those who don't
#   chapters  where it is raised (first entry = where it is confronted head-on)

# Chapter 1 -----------------------------------------------------------------

- id: more-cores-faster
  claim: "More cores always makes it faster."
  reality: >
    Only steps written to use several threads get faster, and only until
    something else limits them. Many steps use one core, and some are
    limited by disk, network, or memory rather than the CPU.
  probe: >
    A step keeps one core at 100% while seven sit idle. Will rerunning it
    with --threads 8 make it faster? (Correct: only if the tool supports
    threads; if it does not, nothing changes.)
  chapters: [01-orientation, 35-performance]

- id: cluster-faster-computer
  claim: "The cluster is just a faster computer."
  reality: >
    A cluster is many ordinary computers shared by many people. You ask a
    scheduler for cores, memory, and time, and your job waits in a queue
    until they are free. A single step is often no faster than on a laptop;
    the gain is running many steps at once, with more memory.
  probe: >
    You submit one single-threaded job to the cluster. Why might it finish
    later than the same job on your laptop? (Correct: it waits in the queue,
    and one core on a compute node is not much faster than a laptop core.)
  chapters: [01-orientation, 10-hpc-slurm]

- id: run-on-login-node
  claim: "I can run my analysis on the login node."
  reality: >
    The login node is a shared doorway for editing files and submitting
    jobs. Heavy work there slows it for everyone, and many sites kill
    long-running processes on it. Analysis runs on compute nodes.
  probe: >
    You have just logged in to the cluster. Where should an alignment of
    48 samples run, and how do you get it there? (Correct: on compute nodes,
    by submitting a job to the scheduler.)
  chapters: [10-hpc-slurm, 01-orientation, 09-working-remotely]

- id: ram-is-disk
  claim: "RAM and disk storage are the same thing."
  reality: >
    RAM is the fast working space a program uses while it runs; it is
    small and emptied when the program stops. Disk is slow, large, and
    keeps files. Running out of RAM gets a job killed; running out of disk
    gives "No space left on device". A file's size on disk is also not the
    RAM a program needs: many tools stream through a file without loading
    it.
  probe: >
    A job stops with the message "Killed" and no output file. Which
    resource most likely ran out? (Correct: RAM, not disk.)
  chapters: [01-orientation, 10-hpc-slurm]

- id: learn-commands-first
  claim: "I need to learn the commands before I can try anything."
  reality: >
    You can run a working analysis by copying commands and checking the
    output. Understanding comes from seeing it work first, then learning
    what each part does (Part II).
  probe: >
    (Not probed by a question; Chapter 1's guided session confronts it by
    having readers run commands before they are explained.)
  chapters: [01-orientation]

- id: windows-needs-linux-pc
  claim: "Windows users need a separate Linux computer."
  reality: >
    WSL2 runs a real Linux system (e.g., Ubuntu) inside Windows. Every
    command in this book works there.
  probe: >
    A classmate on Windows asks whether they need to buy a Linux laptop for
    this course. What do you tell them? (Correct: no; install WSL2 with
    Ubuntu.)
  chapters: [01-orientation]

# Chapter 2 -----------------------------------------------------------------

- id: installed-everywhere
  claim: "Once I install a tool, it works in every terminal."
  reality: >
    Installing the book environment does not add its tools to every
    terminal. `pixi run` runs one command with the environment; `pixi shell`
    starts a shell with it until you type `exit`.
  probe: >
    In a fresh terminal in the book folder, `seqkit stats` says "command not
    found", but `pixi run seqkit stats` works, and you have not installed
    seqkit any other way. Why? (Correct: the environment is only active
    through `pixi run` or `pixi shell`.)
  chapters: [02-book-setup, 07-linux-system, 23-environments]

- id: need-sudo-to-install
  claim: "I need admin rights (sudo) to install the tools I use."
  reality: >
    Analysis tools install into your own space with pixi or conda, which is
    the normal way on a cluster where you never have sudo. Some system
    components and container runtimes do need your site's admins.
  probe: >
    On the cluster, `sudo apt install samtools` fails with "not in the
    sudoers file". What do you do? (Correct: install it into your own
    environment with pixi or conda, or use the site's module; not ask for
    sudo.)
  chapters: [02-book-setup, 23-environments]

- id: remote-runs-on-laptop
  claim: "With VS Code connected to the cluster, my code runs on my laptop."
  reality: >
    The window is local; a VS Code server runs on the remote machine, and
    the files, terminal, and most extensions are there. Laptop files and
    the laptop's environment are not copied over.
  probe: >
    In a VS Code window connected to the cluster you open a terminal and run
    `ls ~/bioinf-computing`, a folder on your laptop. What happens? (Correct:
    "No such file or directory", unless you made that folder on the
    cluster too.)
  chapters: [02-book-setup, 09-working-remotely]

- id: closing-tab-ends-session
  claim: "Closing the browser tab ends my Open OnDemand session."
  reality: >
    The session is a cluster job that keeps its compute node until you
    click Cancel on its card in My Interactive Sessions or it reaches its
    time limit. Closing the tab only closes your view of it (checked on
    Nova, 2026-11-16).
  probe: >
    You close the VS Code tab and reopen My Interactive Sessions. What does
    the card say, and how do you free the node? (Correct: still Running
    with time remaining; click Cancel.)
  chapters: [02-book-setup, 10-hpc-slurm]

- id: ide-required
  claim: "I need RStudio for R and Jupyter for Python."
  reality: >
    Any editor plus a terminal runs both. VS Code edits R and Python
    scripts, runs notebooks, and renders Quarto; RStudio and Jupyter are
    options, not requirements.
  probe: >
    (Not probed by a question; Chapter 2's reference table and Chapters
    12-13 confront it by running R and Python from VS Code.)
  chapters: [02-book-setup, 12-r-essentials, 13-python-essentials]

- id: stuck-in-vim
  claim: "If vim opens, I have to close the terminal to get out."
  reality: >
    Press Esc, type `:q!`, press Enter to quit without saving. To make the
    tool that opened vim (such as `git commit`) stop, use `:cq` instead.
  probe: >
    A command opened vim and the screen fills with `~` lines. How do you
    leave without saving? (Correct: Esc, `:q!`, Enter.)
  chapters: [02-book-setup, 08-shell-scripts]

# Chapter 4 -----------------------------------------------------------------

- id: no-error-means-correct
  claim: "If no error appears, the result is right."
  reality: >
    Warnings let runs continue, and some tool versions report success
    after printing an error (seqkit 2.14.0 on a truncated file exits 0).
    Check outputs against something you know: a read count, a file size,
    a number from the paper.
  probe: >
    `as.integer(c("12","7","n/a"))` finished without an error. Is the
    result fine? (Correct: only if `n/a` means missing in that column.)
  chapters: [04-getting-help, 08-shell-scripts]

- id: last-line-is-the-error
  claim: "The last line of the output is the error that matters."
  reality: >
    Look for the earliest relevant failure in this run; later lines are
    often consequences, and the useful detail can sit in a warning after
    the error (R's `cannot open file ...` warning).
  probe: >
    R prints `Error in file(file, "rt") : cannot open the connection`,
    then a warning. Where is the name of the missing file? (Correct: in
    the warning, after the error.)
  chapters: [04-getting-help, 10-hpc-slurm, 26-nf-core]

- id: asking-is-failure
  claim: "Asking for help means I wasn't good enough to solve it."
  reality: >
    Everyone asks. A well-made request is a skill, and some problems
    (broken nodes, quotas, accounts) only administrators can fix.
  probe: >
    A module that loaded yesterday will not load today, and you changed
    nothing. Keep trying for a day, or report it? (Correct: report it
    with what you saw and checked; you need not know the cause.)
  chapters: [04-getting-help]

- id: screenshot-is-fine
  claim: "A screenshot of the error is the easiest way to ask."
  reality: >
    Text can be searched, copied, quoted, and read by screen readers;
    screenshots crop the first error and hide the command. A screenshot
    can add to text (a dialog, a panel), not replace it.
  probe: >
    Why paste the error as text? (Correct: searchable, quotable,
    accessible, and it keeps the first line and the command.)
  chapters: [04-getting-help, 22-github]

- id: ai-code-is-tested
  claim: "Code from an AI assistant works; I can assume it has been tested."
  reality: >
    It is generated text. Flags can be invented or belong to another
    version, and even code described as tested may have been tested on
    other inputs or another system. Check flags in `--help` and
    reproduce a known result.
  probe: >
    An assistant suggests `seqkit stats --count-pairs`. What do you check
    first? (Correct: that the flag is in `seqkit stats --help` for your
    version; in 2.14.0 it is not.)
  chapters: [04-getting-help]

- id: docs-match-my-version
  claim: "The online documentation describes the version I have installed."
  reality: >
    Websites usually show the latest release. Check your version
    (`--version`, `pixi list`) and use `--help`, which comes from the
    program you run.
  probe: >
    A flag from the tool's website gives `unknown flag`. What is the
    likely reason? (Correct: your installed version is older than the
    one the website describes.)
  chapters: [04-getting-help, 23-environments]

# Chapter 3 -----------------------------------------------------------------

- id: checksum-proves-correct
  claim: "If the checksums match, my data are correct."
  reality: >
    A match proves the file is byte-for-byte the one the checksum was made
    from. It says nothing about whether that file was the right sample or
    good data.
  probe: >
    A facility mislabelled a file before computing its MD5. Does
    `md5sum -c` catch the mistake? (Correct: no; it prints OK.)
  chapters: [03-organizing-projects, 20-reference-data]

- id: symlink-is-copy
  claim: "A symbolic link is a copy, so editing or deleting through it is safe."
  reality: >
    A link is another route to the same data. Writing through it changes
    the original, and `rm -r link/` with a trailing slash can delete the
    target (captured 2026-11-17: on macOS the whole folder, on Ubuntu every
    file inside it). Remove only the link with
    `unlink link` or `rm link`, no slash.
  probe: >
    You run `unlink data/ref`. Is the reference genome gone? (Correct: no,
    only the link.)
  chapters: [03-organizing-projects, 05-shell-basics]

- id: readonly-cant-delete
  claim: "A read-only file can't be deleted."
  reality: >
    Deleting, moving, and adding files are controlled by the folder's
    permissions. Protect the folder as well as the files.
  probe: >
    A file is read-only but its folder is writable. Does `rm -f file`
    remove it? (Correct: yes.)
  chapters: [07-linux-system, 03-organizing-projects]

- id: cluster-is-backed-up
  claim: "Everything on the cluster is backed up."
  reality: >
    Scratch is purged and never backed up. Which other areas are backed up
    or snapshotted, and for how long, differs by site; SCINet backs up none
    of its cluster storage.
  probe: >
    Your only copy of the raw reads is in `/90daydata`. What happens in
    three months? (Correct: they are deleted permanently.)
  chapters: [03-organizing-projects, 10-hpc-slurm]

- id: sync-is-backup
  claim: "My Dropbox/OneDrive/Google Drive folder is my backup."
  reality: >
    Sync copies deletions and overwrites to every device: one copy in two
    places, protected only by version history for as long as the service
    keeps it.
  probe: >
    You overwrite a file in your OneDrive folder by mistake. Is the old
    version safe? (Correct: only if version history still holds it.)
  chapters: [03-organizing-projects]

- id: ill-remember
  claim: "I'll remember where this file came from and how I made it."
  reality: >
    Weeks later no one does. Record source, version, checksum, script,
    command, software, and a log when the file is made.
  probe: >
    A reviewer asks which seqkit version made a table. Where do you look?
    (Correct: the run's log and the lockfile; not memory.)
  chapters: [03-organizing-projects, 23-environments]

# Chapter 5 -----------------------------------------------------------------

- id: relative-to-script
  claim: "A relative path is relative to the script (or file) that contains it."
  reality: >
    A relative path is read from the current working directory of the
    shell that runs the command, wherever the script itself is stored.
  probe: >
    From `~` you run `bash ~/bioinf-computing-ch05/where.sh`, which
    contains `ls data/raw`. Which folder does `ls` look in? (Correct:
    `~/data/raw`, which does not exist; captured 2026-11-17:
    `ls: cannot access 'data/raw'`.)
  chapters: [05-shell-basics, 04-getting-help, 08-shell-scripts]

- id: rm-has-undo
  claim: "Deleted files go to a trash folder I can restore them from."
  reality: >
    `rm` removes the name at once. There is no trash on the command line;
    only backups or site snapshots can bring a file back.
  probe: >
    You `rm` a results file by mistake on a cluster. Where do you look?
    (Correct: not in a trash folder; ask whether your site keeps
    snapshots of that storage, or rerun from the raw data.)
  chapters: [05-shell-basics, 03-organizing-projects]

- id: cp-mv-warn
  claim: "`cp` and `mv` warn me before they overwrite a file."
  reality: >
    They overwrite silently unless given `-i` (ask) or `-n` (never
    overwrite).
  probe: >
    What does `mv new.tsv old.tsv` do if `old.tsv` already exists?
    (Correct: replaces it without a question.)
  chapters: [05-shell-basics]

- id: program-sees-wildcard
  claim: "The program reads the `*` and finds the matching files itself."
  reality: >
    For an unquoted pattern, bash expands it before the program starts;
    the program gets the matching names, or the unchanged pattern when
    nothing matches. Only a quoted pattern reaches the program, which
    some programs (`find -name`) want.
  probe: >
    Why did seqkit's error in Chapter 4 contain a literal `*.fq.gz`?
    (Correct: nothing matched, so bash passed the pattern on unchanged.)
  chapters: [05-shell-basics, 04-getting-help, 08-shell-scripts]

- id: open-to-look
  claim: "To see what is in a file, I open it in an editor."
  reality: >
    Large files can freeze an editor and compressed ones show noise.
    `head`, `less`, and `file` let you look without loading the whole
    file into an editor.
  probe: >
    How do you see the first read of a 10 GB `.fastq.gz`? (Correct:
    `gunzip -c file | head -n 4`, or `zless`.)
  chapters: [05-shell-basics, 15-fasta-fastq]
